name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Only build main when something that ends up in the packages (or the build itself) changes.
    paths:
      - 'src/**'
      - 'docs/**'
      - 'LICENSE.txt'
      - 'README.md'
      - 'version.json'
      - 'build/**'
      - '.config/**'
      - '.github/workflows/ci.yml'
  # Run manually from main to release to NuGet.
  workflow_dispatch:

# Pushes are batched: a queued run is replaced by a newer one. Manual releases get their own group so a push can't replace them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning needs full history to calculate the version height.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and pack
        shell: pwsh
        run: ./build/build.ps1

      - name: Get version
        id: version
        run: echo "version=$(dotnet nbgv get-version -v NuGetPackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $summary = './artifacts/testCoverage/SummaryGithub.md'
          if (Test-Path $summary) { Get-Content $summary | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: artifacts/dist/*.nupkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/testResults
            artifacts/testCoverage
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write # create the tag and GitHub release
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Last, so a failed push can be retried without a release already in the way.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" dist/*.nupkg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes
          fi
